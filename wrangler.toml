name = "pg-website-manager"
main = "src/worker/index.ts"
compatibility_date = "2024-12-01"
account_id = "8863165c91205bf43cd93c16208a4fa3"

# Static assets from the UI build
[site]
bucket = "./dist"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "pg-uptime"
database_id = "f83cb54d-256e-4c33-9ef3-4a66d1ff71b4"

# R2 Bucket (for viewing backup status)
# [[r2_buckets]]
# binding = "BACKUPS"
# bucket_name = "pg-backups"

# Cron trigger for uptime checks
[triggers]
crons = ["*/5 * * * *"]

# Environment variables (set via wrangler secret put)
# SLACK_WEBHOOK_URL
# AWS_ACCESS_KEY_ID
# AWS_SECRET_ACCESS_KEY
# AWS_REGION
# ALERT_FROM_EMAIL
# ALERT_TO_EMAIL

[vars]
ENVIRONMENT = "production"
